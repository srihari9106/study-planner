<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Planner | User Registration</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

body {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

.bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
.bg-animation .shape { position: absolute; opacity: 0.1; animation: float 20s infinite ease-in-out; }
.bg-animation .shape:nth-child(1) { top: 10%; left: 10%; width: 80px; height: 80px; background: #fff; border-radius: 50%; animation-delay: 0s; }
.bg-animation .shape:nth-child(2) { top: 70%; left: 80%; width: 120px; height: 120px; background: #fff; border-radius: 50%; animation-delay: 2s; }
.bg-animation .shape:nth-child(3) { top: 40%; left: 30%; width: 100px; height: 100px; background: #fff; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation-delay: 4s; }
.bg-animation .shape:nth-child(4) { top: 20%; left: 70%; width: 60px; height: 60px; background: #fff; border-radius: 50%; animation-delay: 1s; }
.bg-animation .shape:nth-child(5) { top: 60%; left: 20%; width: 90px; height: 90px; background: #fff; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation-delay: 3s; }

@keyframes float { 0%,100% { transform: translateY(0) rotate(0deg);} 50% { transform: translateY(-20px) rotate(10deg);} }

.particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
.particle { position: absolute; width: 5px; height: 5px; background: rgba(255,255,255,0.5); border-radius: 50%; animation: particle-fall linear infinite; }
@keyframes particle-fall { 0% { transform: translateY(-100px); opacity: 0; } 10% { opacity: 1;} 90% { opacity: 1;} 100% { transform: translateY(100vh); opacity: 0;} }

.container {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    width: 100%;
    max-width: 450px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    animation: fadeIn 1s ease;
}

@keyframes fadeIn { from { opacity:0; transform:translateY(20px);} to { opacity:1; transform:translateY(0);} }

.logo { margin-bottom:20px; }
.logo i { font-size:3rem; color:#fff; animation: pulse 2s infinite; }
@keyframes pulse { 0% { transform:scale(1);} 50% { transform:scale(1.1);} 100% { transform:scale(1);} }

h2 { margin-bottom:30px; font-size:2em; font-weight:600; }

.input-group { position: relative; margin-bottom: 20px; }
.input-group i { position:absolute; left:15px; top:50%; transform:translateY(-50%); color: rgba(255,255,255,0.7); font-size:1.1rem; }

input[type="text"], input[type="email"], input[type="password"] {
    width:100%; padding:12px 15px 12px 45px; margin:10px 0; border:none; border-radius:30px;
    outline:none; font-size:1em; background: rgba(255,255,255,0.2); color:#fff; transition: all 0.3s ease;
}
input::placeholder { color: rgba(255,255,255,0.7); }
input:focus { background: rgba(255,255,255,0.3); box-shadow:0 0 15px rgba(255,255,255,0.2); }

button {
    width:100%; padding:12px; margin-top:20px; border:none; border-radius:30px;
    background: linear-gradient(45deg, #4caf50, #8bc34a); color:white; font-size:1em; font-weight:600;
    cursor:pointer; transition: all 0.3s ease; position: relative; overflow:hidden;
}
button::before { content: ''; position:absolute; top:0; left:-100%; width:100%; height:100%; background: rgba(255,255,255,0.2); transition: left 0.5s; }
button:hover::before { left:100%; }
button:hover { transform: translateY(-3px); box-shadow:0 10px 20px rgba(0,0,0,0.2); }

.login-link { margin-top:15px; display:block; color:#fff; text-decoration:none; transition: all 0.3s ease; }
.login-link:hover { text-decoration:underline; transform: translateY(-2px); display:inline-block; }

@media (max-width:500px){ .container{ padding:30px 20px;} h2{ font-size:1.5em;} }
</style>
</head>
<body>
<div class="bg-animation">
    <div class="shape"></div><div class="shape"></div><div class="shape"></div><div class="shape"></div><div class="shape"></div>
</div>

<div class="particles" id="particles"></div>

<div class="container">
    <div class="logo"><i class="fas fa-user-graduate"></i></div>
    <h2>User Registration</h2>

    <form id="registerForm">
        <div class="input-group"><i class="fas fa-user"></i><input type="text" name="name" placeholder="Full Name" required></div>
        <div class="input-group"><i class="fas fa-envelope"></i><input type="email" name="email" placeholder="Email Address" required></div>
        <div class="input-group"><i class="fas fa-lock"></i><input type="password" name="password" placeholder="Password" required></div>
        <div class="input-group"><i class="fas fa-lock"></i><input type="password" name="confirm_password" placeholder="Confirm Password" required></div>
        <button type="submit">Register</button>
    </form>

    <a class="login-link" href="user_login.html">Already have an account? Login here</a>
</div>

<script>
function createParticles() {
    const container = document.getElementById('particles');
    const count = 50;
    for(let i=0;i<count;i++){
        const p=document.createElement('div');
        p.className='particle';
        p.style.left = `${Math.random()*100}%`;
        p.style.top = `${Math.random()*100}%`;
        const size = Math.random()*5+2;
        p.style.width = `${size}px`; p.style.height = `${size}px`;
        p.style.animationDuration = `${Math.random()*10+10}s`;
        p.style.animationDelay = `${Math.random()*5}s`;
        container.appendChild(p);
    }
}
window.addEventListener('load', createParticles);

// Input focus
const inputs = document.querySelectorAll('input[type="text"],input[type="email"],input[type="password"]');
inputs.forEach(i=>{ i.addEventListener('focus',()=>{ i.parentElement.style.transform='scale(1.02)'; i.parentElement.style.transition='transform 0.3s ease'; }); i.addEventListener('blur',()=>{ i.parentElement.style.transform='scale(1)'; }); });

// Registration logic
const registerForm = document.getElementById('registerForm');
registerForm.addEventListener('submit', function(e){
    e.preventDefault();
    const name = this.name.value;
    const email = this.email.value;
    const password = this.password.value;
    const confirmPassword = this.confirm_password.value;

    if(password !== confirmPassword){ alert('Passwords do not match!'); return; }

    // Get existing users from localStorage
    let users = JSON.parse(localStorage.getItem('users')) || [];

    // Check if email already exists
    if(users.find(u=>u.email === email)){
        alert('Email already registered!');
        return;
    }

    // Add new user
    users.push({name, email, password});
    localStorage.setItem('users', JSON.stringify(users));

    alert('Registration Successful! Redirecting to Login...');
    window.location.href = 'user_login.html';
});
</script>
</body>
</html>

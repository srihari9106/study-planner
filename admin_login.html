<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Planner | Admin Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* General Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        color: #fff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
    }

    .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
    .bg-animation .shape { position: absolute; opacity: 0.1; animation: float 20s infinite ease-in-out; }
    .bg-animation .shape:nth-child(1) { top: 10%; left: 10%; width: 80px; height: 80px; background: #fff; border-radius: 50%; animation-delay: 0s; }
    .bg-animation .shape:nth-child(2) { top: 70%; left: 80%; width: 120px; height: 120px; background: #fff; border-radius: 50%; animation-delay: 2s; }
    .bg-animation .shape:nth-child(3) { top: 40%; left: 30%; width: 100px; height: 100px; background: #fff; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation-delay: 4s; }
    .bg-animation .shape:nth-child(4) { top: 20%; left: 70%; width: 60px; height: 60px; background: #fff; border-radius: 50%; animation-delay: 1s; }
    .bg-animation .shape:nth-child(5) { top: 60%; left: 20%; width: 90px; height: 90px; background: #fff; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation-delay: 3s; }
    @keyframes float { 0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-20px) rotate(10deg);} }

    .particles { position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; }
    .particle { position: absolute; width:5px; height:5px; background: rgba(255,255,255,0.5); border-radius:50%; animation: particle-fall linear infinite; }
    @keyframes particle-fall { 0%{transform:translateY(-100px); opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateY(100vh); opacity:0;} }

    .container {
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 20px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        animation: fadeIn 1s ease;
    }
    @keyframes fadeIn { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }

    .logo { margin-bottom: 20px; }
    .logo i { font-size: 3rem; color: #fff; animation: pulse 2s infinite; }
    @keyframes pulse { 0%{transform:scale(1);}50%{transform:scale(1.1);}100%{transform:scale(1);} }

    h2 { margin-bottom:30px; font-size:2em; font-weight:600; }
    .input-group { position: relative; margin-bottom:20px; }
    .input-group i { position: absolute; left: 15px; top:50%; transform:translateY(-50%); color: rgba(255,255,255,0.7); font-size:1.1rem; }
    input[type="text"], input[type="password"] {
        width: 100%; padding: 12px 15px 12px 45px; margin:10px 0; border:none; border-radius:30px;
        outline:none; font-size:1em; background: rgba(255,255,255,0.2); color:#fff; transition: all 0.3s ease;
    }
    input::placeholder { color: rgba(255,255,255,0.7); }
    input:focus { background: rgba(255,255,255,0.3); box-shadow: 0 0 15px rgba(255,255,255,0.2); }

    button {
        width:100%; padding:12px; margin-top:20px; border:none; border-radius:30px;
        background: linear-gradient(45deg,#ff9800,#ffb74d); color:white; font-size:1em; font-weight:600;
        cursor:pointer; transition: all 0.3s ease; position:relative; overflow:hidden;
    }
    button::before {
        content:''; position:absolute; top:0; left:-100%; width:100%; height:100%; background: rgba(255,255,255,0.2); transition:left 0.5s;
    }
    button:hover::before { left:100%; }
    button:hover { transform:translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

    .admin-badge { display:inline-block; background: rgba(255,152,0,0.3); color:#fff; padding:5px 15px; border-radius:20px; font-size:0.8rem; margin-bottom:20px; border:1px solid rgba(255,152,0,0.5); }

    @media (max-width:500px) { .container { padding:30px 20px; } h2 { font-size:1.5em; } }
</style>
</head>
<body>

<div class="bg-animation">
    <div class="shape"></div><div class="shape"></div><div class="shape"></div><div class="shape"></div><div class="shape"></div>
</div>

<div class="particles" id="particles"></div>

<div class="container">
    <div class="logo"><i class="fas fa-user-shield"></i></div>
    <div class="admin-badge"><i class="fas fa-lock"></i> Administrator Access</div>
    <h2>Admin Login</h2>

    <form id="loginForm">
        <div class="input-group"><i class="fas fa-user"></i><input type="text" id="username" placeholder="Username" required></div>
        <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Password" required></div>
        <button type="submit">Login</button>
        <a href="index.html">Back To Home</a>
    </form>
</div>

<script>
    // Create particles
    function createParticles() {
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            const size = Math.random() * 5 + 2;
            const duration = Math.random() * 10 + 10;
            particle.style.left = posX + '%';
            particle.style.top = posY + '%';
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.animationDuration = duration + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(particle);
        }
    }
    window.addEventListener('load', createParticles);

    // Input focus animation
    const inputFields = document.querySelectorAll('input');
    inputFields.forEach(field=>{
        field.addEventListener('focus',function(){ this.parentElement.style.transform='scale(1.02)'; this.parentElement.style.transition='transform 0.3s ease'; });
        field.addEventListener('blur',function(){ this.parentElement.style.transform='scale(1)'; });
    });

    // Simple JS Login Redirect
    document.getElementById('loginForm').addEventListener('submit', function(e){
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Dummy check: username=admin, password=admin123
        if(username === "admin" && password === "admin123"){
            alert("Login Successful! Redirecting to Admin Dashboard...");
            window.location.href = "admin_dashboard.html"; // replace with your dashboard HTML file
        } else {
            alert("Invalid username or password!");
        }
    });
</script>

</body>
</html>
